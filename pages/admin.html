<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - АвтоСтарт</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <!-- ШАПКА САЙТА -->
    <header class="header">
        <div class="header-wrapper">
            <a href="../index.html" class="logo">
                <img src="../png/logo.png" alt="логотип автошколы">
                <span class="logo-name">АвтоСтарт</span>
            </a>

            <ul class="menu" id="menu">
                <li><a href="../index.html">Главная</a></li>
                <li><a href="about.html">О школе</a></li>
                <li><a href="cars.html">Машины</a></li>
                <li><a href="instructors.html">Инструкторы</a></li>
                <li><a href="contacts.html">Контакты</a></li>
                <li><a href="reagistration.html">Записаться</a></li>
            </ul>

            <button class="burger-btn" onclick="toggleMenu()">☰</button>
        </div>
    </header>

    <!-- ФОРМА ВХОДА В АДМИНКУ -->
    <section class="form-block" id="loginBlock">
        <form class="form-box" onsubmit="checkLogin()">
            <h2>Вход для администратора</h2>

            <div class="form-group">
                <label for="adminLogin">Логин</label>
                <input type="text" id="adminLogin" placeholder="admin">
            </div>

            <div class="form-group">
                <label for="adminPassword">Пароль</label>
                <input type="password" id="adminPassword" placeholder="пароль">
            </div>

            <div class="form-error" id="loginError"></div>

            <button type="submit" class="btn">Войти</button>
            <p class="admin-hint">Для теста: admin / 1234</p>
        </form>
    </section>

    <!-- ПАНЕЛЬ С ЗАЯВКАМИ, СНАЧАЛА СКРЫТА -->
    <section class="page-content" id="panelBlock" style="display:none;">
        <h1>Заявки на обучение</h1>
        <div id="zayavkiPlace"></div>
        <button class="btn btn-dark" onclick="logoutAdmin()">Выйти</button>
    </section>

    <!-- ФУТЕР -->
    <footer class="footer">
        <div class="footer-wrapper">
            <div class="footer-col">
                <h4>АвтоСтарт</h4>
                <p>Автошкола категории B</p>
            </div>
            <div class="footer-col">
                <h4>Контакты</h4>
                <a href="tel:+74957000000">+7 (495) 700-00-00</a>
                <a href="mailto:info@autostart.example">info@autostart.example</a>
            </div>
            <div class="footer-col">
                <h4>Страницы</h4>
                <a href="about.html">О школе</a>
                <a href="contacts.html">Контакты</a>
                <a href="admin.html">Админ-панель</a>
            </div>
        </div>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
