<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Записаться - АвтоСтарт</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body onload="generateCaptcha()">

    <!-- ШАПКА САЙТА -->
    <header class="header">
        <div class="header-wrapper">
            <a href="../index.html" class="logo">
                <img src="../png/logo.png" alt="логотип автошколы">
                <span class="logo-name">АвтоСтарт</span>
            </a>

            <ul class="menu" id="menu">
                <li><a href="../index.html">Главная</a></li>
                <li><a href="about.html">О школе</a></li>
                <li><a href="cars.html">Машины</a></li>
                <li><a href="instructors.html">Инструкторы</a></li>
                <li><a href="contacts.html">Контакты</a></li>
                <li><a href="reagistration.html" class="active">Записаться</a></li>
            </ul>

            <button class="burger-btn" onclick="toggleMenu()">☰</button>
        </div>
    </header>

    <!-- ФОРМА ЗАПИСИ -->
    <section class="form-block">
        <form class="form-box" id="regForm" onsubmit="checkForm()">
            <h2>Записаться на курс</h2>

            <div class="form-group">
                <label for="userName">Ваше имя</label>
                <input type="text" id="userName" placeholder="Как вас зовут?">
                <div class="form-error" id="nameError"></div>
            </div>

            <div class="form-group">
                <label for="userPhone">Телефон</label>
                <input type="tel" id="userPhone" placeholder="+7 900 000-00-00">
                <div class="form-error" id="phoneError"></div>
            </div>

            <div class="form-group">
                <label>Простая проверка: сколько будет <span id="num1"></span> + <span id="num2"></span> ?</label>
                <input type="text" id="captchaInput" placeholder="Ваш ответ">
                <div class="form-error" id="captchaError"></div>
            </div>

            <button type="submit" class="btn">Записаться</button>

            <div class="form-success" id="successBlock" style="display:none;">
                Спасибо! Мы вам скоро перезвоним.
            </div>
        </form>
    </section>

    <!-- ФУТЕР -->
    <footer class="footer">
        <div class="footer-wrapper">
            <div class="footer-col">
                <h4>АвтоСтарт</h4>
                <p>Автошкола категории B</p>
            </div>
            <div class="footer-col">
                <h4>Контакты</h4>
                <a href="tel:+74957000000">+7 (495) 700-00-00</a>
                <a href="mailto:info@autostart.example">info@autostart.example</a>
            </div>
            <div class="footer-col">
                <h4>Страницы</h4>
                <a href="about.html">О школе</a>
                <a href="contacts.html">Контакты</a>
                <a href="admin.html">Админ-панель</a>
            </div>
        </div>
    </footer>

    <script src="../js/main.js"></script>
    <script src="../js/registration.js"></script>
    <!-- generateCaptcha() запускается в body onload наверху страницы -->

</body>
</html>
